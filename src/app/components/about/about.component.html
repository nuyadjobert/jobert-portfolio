<section id="about" class="px-5 sm:px-8 py-24 sm:py-32">
  <div class="max-w-6xl mx-auto">

    <!-- Section heading -->
    <div
      class="flex items-center gap-4 mb-14 scroll-reveal-left"
      appScrollReveal
    >
      <span class="section-kicker">
        01 — Journey
      </span>

      <div class="gold-rule flex-1"></div>
    </div>


    <div class="grid lg:grid-cols-12 gap-12 items-start">

      <!-- LEFT SIDE -->
      <div
        class="lg:col-span-5 scroll-reveal-left"
        appScrollReveal
      >

        <h2
          class="font-display text-4xl sm:text-5xl font-bold leading-tight mb-6"
        >
          From curiosity to<br />

          <span class="text-gold">
            crafted products.
          </span>
        </h2>

        <p class="text-mute leading-relaxed">
          A front-end first path that grew into full-stack work —
          interfaces, logic, and the data that holds it together.
        </p>

      </div>


      <!-- RIGHT SIDE / TIMELINE -->
      <div class="lg:col-span-7 space-y-0">

        <article
          *ngFor="let step of journey; let i = index"

          appScrollReveal

          [class.scroll-reveal-right]="i % 2 === 0"
          [class.scroll-reveal-left]="i % 2 !== 0"

          [style.transition-delay.ms]="i * 120"

          class="relative pl-8 pb-10 last:pb-0 border-l border-line"
        >

          <!-- Timeline circle -->

          <span
            class="absolute -left-[7px] top-1 w-3.5 h-3.5 rounded-full bg-void border-2 border-gold"
          ></span>


          <!-- Step label -->

          <p class="font-mono text-xs text-gold mb-2">
            0{{ i + 1 }} / {{ step.label }}
          </p>


          <!-- Description -->

          <p class="text-cream/90 text-lg leading-relaxed">
            {{ step.text }}
          </p>

        </article>

      </div>

    </div>
  </div>
</section>

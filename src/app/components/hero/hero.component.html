<section id="hero" class="hero" aria-label="Introduction">
  <div class="hero-decor" aria-hidden="true">
    <span class="hero-triangle"></span>
    <span class="hero-ring hero-ring-a"></span>
    <span class="hero-ring hero-ring-b"></span>
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="blob blob-d"></span>
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>
    <span class="particle p6"></span>
  </div>

  <div class="hero-inner">
    <div class="hero-stage">
      <ul class="hero-dots" aria-hidden="true">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>

      <div class="portrait-wrap">
        <div class="portrait-orb"></div>
        <div class="portrait-halo"></div>
        <figure class="portrait-cut">
          <img
            [src]="profile.photo"
            [alt]="'Professional portrait of ' + profile.name"
            class="portrait-photo"
            width="640"
            height="800"
          />
        </figure>
      </div>
    </div>

    <div class="hero-copy">
      <p class="hero-kicker reveal">
        {{ profile.location }}
      </p>

      <h1 class="hero-title">
        <span class="hero-title-main">app/web</span>
        <span class="hero-title-sub">Developer</span>
      </h1>

      <p class="section-kicker hero-role role-typewriter">
        {{ currentRole }}<span class="role-cursor" aria-hidden="true"></span>
      </p>

      <p class="hero-intro reveal reveal-d4">
        {{ profile.tagline }}
      </p>

      <div class="hero-actions reveal reveal-d5">
        <a href="#projects" class="btn-gold">Explore My Work</a>
        <a href="#contact" class="btn-ghost">Let's Talk</a>
      </div>
    </div>
  </div>

  <a href="#about" class="scroll-cue hero-scroll">
    <span class="hero-scroll-line"></span>
    Scroll
  </a>
</section>

<section id="skills" class="px-5 sm:px-8 py-24 sm:py-32">
  <div class="max-w-6xl mx-auto skills-container">

    <!-- Section heading (identical structure to Journey) -->
    <div class="flex items-center gap-4 mb-14 scroll-reveal-left" appScrollReveal>
      <span class="section-kicker">
        02 — Stack
      </span>

      <div class="gold-rule flex-1"></div>
    </div>

    <!-- HEADER -->
    <div class="skills-header scroll-reveal-left" appScrollReveal>

      <h2>
        Skills & <span>Technologies</span>
      </h2>

      <p>
        Technologies and tools I use to design and develop
        modern web and mobile applications.
      </p>

    </div>


    <!-- CATEGORIES -->

    <div class="skills-categories">

      <div class="skills-category" *ngFor="let group of groups">

        <div class="category-header scroll-reveal-left" appScrollReveal>

          <span class="category-line"></span>

          <h3>
            {{ group[0] }}
          </h3>

        </div>

        <div class="skills-grid">

          <div class="skill-item" *ngFor="let name of group[1]; let i = index" [class.scroll-reveal-left]="i % 2 === 0"
            [class.scroll-reveal-right]="i % 2 !== 0" appScrollReveal>

            <div class="skill-icon">

              <!-- Normal Devicon icons -->
              <i *ngIf="name !== 'REST API' && name !== 'MVC Architecture'" [class]="iconFor(name)"></i>

              <!-- REST API -->
              <span *ngIf="name === 'REST API'" class="api-icon">
                API
              </span>

              <!-- MVC Architecture -->
              <svg *ngIf="name === 'MVC Architecture'" class="mvc-icon" viewBox="0 0 24 24" fill="none"
                stroke="#555555" stroke-width="2">
                <rect x="3" y="4" width="5" height="5" rx="1"></rect>
                <rect x="16" y="4" width="5" height="5" rx="1"></rect>
                <rect x="9.5" y="15" width="5" height="5" rx="1"></rect>

                <path d="M8 6.5h8"></path>
                <path d="M18.5 9v3"></path>
                <path d="M5.5 9v3"></path>
                <path d="M5.5 12h13"></path>
                <path d="M12 12v3"></path>
              </svg>

            </div>

            <span class="skill-name">
              {{ name }}
            </span>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

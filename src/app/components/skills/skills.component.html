<section id="skills" class="skills-section">

  <div class="skills-container">

    <!-- HEADER -->

    <div class="skills-header scroll-reveal-left" appScrollReveal>

      <span class="section-label">
        MY STACK
      </span>

      <h2>
        Skills & <span>Technologies</span>
      </h2>

      <p>
        Technologies and tools I use to design and develop
        modern web and mobile applications.
      </p>

    </div>


    <!-- CATEGORIES -->

    <div class="skills-categories">

      <div class="skills-category" *ngFor="let group of groups">

        <!-- CATEGORY TITLE -->

        <div class="category-header scroll-reveal-left" appScrollReveal>

          <span class="category-line"></span>

          <h3>
            {{ group[0] }}
          </h3>

        </div>


        <!-- SKILLS -->

        <div class="skills-grid">

          <div class="skill-item" *ngFor="let name of group[1]; let i = index" [class.scroll-reveal-left]="i % 2 === 0"
            [class.scroll-reveal-right]="i % 2 !== 0" appScrollReveal>

            <div class="skill-icon">

              <!-- Normal icon -->

              <i *ngIf="name !== 'REST API'" [class]="iconFor(name)"></i>


              <!-- REST API -->

              <span *ngIf="name === 'REST API'" class="api-icon">
                API
              </span>

            </div>


            <span class="skill-name">
              {{ name }}
            </span>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

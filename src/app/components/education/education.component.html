<section id="education" class="px-5 sm:px-8 py-24 sm:py-32">
  <div class="max-w-6xl mx-auto path-container">

    <!-- Section heading (identical structure to Journey/Skills) -->
    <div class="flex items-center gap-4 mb-14 scroll-reveal-left" appScrollReveal>
      <span class="section-kicker">
        04 — Path
      </span>

      <div class="gold-rule flex-1"></div>
    </div>

    <!-- HEADER -->
    <div class="skills-header">
      <h2>Education & <span>Experience</span></h2>
    </div>

    <!-- EDUCATION: zigzag timeline -->
    <div class="path-category">
      <div class="category-header">
        <div class="category-line"></div>
        <h3>Education</h3>
      </div>

      <div class="timeline">
        <div *ngFor="let ed of education; let i = index" appScrollReveal [class.timeline-left]="i % 2 === 0"
          [class.timeline-right]="i % 2 !== 0" class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-content">
            <p *ngIf="ed.level" class="path-level">{{ ed.level }}</p>
            <p class="path-title">{{ ed.school }}</p>
            <p *ngIf="ed.credential" class="path-sub">{{ ed.credential }}</p>
            <p class="path-period">{{ ed.period }}</p>
            <p *ngIf="ed.note" class="path-note">{{ ed.note }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- EXPERIENCE: zigzag timeline -->
    <div class="path-category">
      <div class="category-header">
        <div class="category-line"></div>
        <h3>Experience</h3>
      </div>

      <div class="timeline">
        <div *ngFor="let job of experience; let i = index" appScrollReveal [class.timeline-left]="i % 2 === 0"
          [class.timeline-right]="i % 2 !== 0" class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-content">
            <p class="path-title">{{ job.role }}</p>
            <p class="path-sub">{{ job.org }}</p>
            <p class="path-period">{{ job.period }}</p>
            <ul class="path-bullets">
              <li *ngFor="let bullet of job.bullets">
                <span class="bullet-dot">▸</span>{{ bullet }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div *ngIf="achievements.length" class="path-category">
      <div class="category-header" style="cursor: pointer;" (click)="toggleAchievements()">
        <div class="category-line"></div>
        <h3>Highlights</h3>
        <h5 class="text-xs font-mono text-gold"> View </h5> <span class="toggle-icon"
          [class.open]="showAchievements">▾</span>
      </div>

      <div *ngIf="showAchievements" appScrollReveal class="scroll-reveal-left path-item">
        <ul class="path-achievements">
          <li *ngFor="let item of achievements">
            <span class="bullet-dot">—</span>{{ item }}
          </li>
        </ul>
        <img [src]="awardImage" alt="Certificate of Recognition: UI/UX Designer of the Year, Aces Tagum College, Inc."
          class="award-image" />
      </div>
    </div>

  </div>
</section>
